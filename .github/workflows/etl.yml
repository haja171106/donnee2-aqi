name: AQI hourly ETL

run-name: "Automated hourly collection — run #${{ github.run_number }} (${{ github.event_name }})"

on:
  repository_dispatch:
    types: [scheduled-hourly-collection]
  workflow_dispatch: {}  

concurrency:
  group: aqi-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            pip install -r requirements.txt && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Extract (hourly mode)
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          for i in 1 2 3; do
            python -m src.extract --mode hourly && break
            echo "Attempt $i failed (OpenWeather API), retrying in 15s..."
            sleep 15
          done

      - name: Transform (rebuild clean/)
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.transform

      - name: Validate data contract
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.validate_clean

      - name: Load warehouse
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.load

      - name: Commit and push updated data
        run: |
          git config user.name "aqi-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw data/clean
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "chore(data): hourly run $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi