name: ETL horaire AQI

on:
  schedule:
    # Conservé en garde-fou : peu fiable seul (GitHub documente ce trigger
    # comme "best-effort", avec des retards possibles sous forte charge),
    # mais inoffensif en complément du déclenchement externe ci-dessous
    # grâce à l'idempotence du pipeline (rejouer un run ne duplique rien).
    - cron: "5 * * * *"
  repository_dispatch:
    # Déclenchement précis : un cron externe (cron-job.org) appelle l'API
    # GitHub toutes les heures pile avec ce type d'événement. Voir
    # ARCHITECTURE.md pour la configuration du cron externe.
    types: [run-etl]
  workflow_dispatch: {}  # déclenchement manuel possible depuis l'onglet Actions

# Un seul run à la fois : si un run précédent traîne encore, on ne veut pas
# que deux processus écrivent dans data/ et poussent des commits en parallèle.
concurrency:
  group: aqi-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installation des dépendances
        run: |
          for i in 1 2 3; do
            pip install -r requirements.txt && break
            echo "Tentative $i échouée, nouvel essai dans 10s..."
            sleep 10
          done

      - name: Extraction (mode horaire)
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          for i in 1 2 3; do
            python -m src.extract --mode hourly && break
            echo "Tentative $i échouée (API OpenWeather), nouvel essai dans 15s..."
            sleep 15
          done

      - name: Transformation (reconstruction de clean/)
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.transform

      - name: Validation du contrat de données
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.validate_clean

      - name: Chargement du warehouse
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.load

      - name: Commit et push des données mises à jour
        run: |
          git config user.name "aqi-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw data/clean
          if git diff --cached --quiet; then
            echo "Rien de nouveau à committer."
          else
            git commit -m "chore(data): run horaire $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi